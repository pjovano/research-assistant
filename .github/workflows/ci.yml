name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ANONYMIZED_TELEMETRY: "False"
  HF_HUB_OFFLINE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONIOENCODING: utf-8
  UV_PYTHON: "3.12"
  UV_TORCH_BACKEND: cpu

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv venv
      - run: uv pip install ruff -c requirements.lock
      - run: uv run --no-project ruff check .

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv venv
      - run: uv pip install pyyaml ruff -c requirements.lock
      - uses: ./.github/actions/empty-vault
      - name: Run the audit's lint within 60 seconds, without the rows the audit baseline acknowledges
        run: |
          timeout 60 uv run --no-project python .claude/skills/control-plane-audit/scripts/audit.py lint --new > audit.json
          jq '{code, prose, redundancy, staleness, weight}' audit.json
      - name: Fail on an unacknowledged xref or special row, or on a lint check that could not run
        run: |
          jq '{xref, special, skipped}' audit.json
          jq -e '(.xref | length) == 0 and (.special | length) == 0 and .skipped == null' audit.json

  word-ratchet:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv venv
      - run: uv pip install pyyaml -c requirements.lock
      - uses: ./.github/actions/empty-vault
      - name: Fail if the instruction text grew without a stated reason
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s\n' "$PULL_REQUEST_BODY" > "$RUNNER_TEMP/body.md"
          uv run --no-project python .claude/skills/control-plane-audit/scripts/audit.py ratchet \
            --base "$BASE_SHA" --body-file "$RUNNER_TEMP/body.md"

  publish-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks, verified against its published checksum
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Fail if the tree or any commit carries a secret
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --exit-code 1 .
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --exit-code 1 .
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv venv
      - run: uv pip install pyyaml -c requirements.lock
      - uses: ./.github/actions/empty-vault
      - name: Fail if code or instruction text names a library work
        run: |
          uv run --no-project python .claude/skills/control-plane-audit/scripts/audit.py lint > audit.json
          jq '.works' audit.json
          jq -e '.works == []' audit.json

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv venv
      - run: uv pip sync requirements.lock
      - uses: ./.github/actions/empty-vault
      - name: Install pandoc, which the tests of the draft conversion run
        uses: pandoc/actions/setup@v1
        with:
          version: "3.12"
      - name: Require node, which the tests of the ingest workflow run under
        run: node --version
      - run: uv run --no-project python -m unittest discover -s tests
        env:
          REQUIRE_JS_RUNTIME: "1"
