title = "research-assistant"

[extend]
useDefault = true

[[allowlists]]
description = "A citation key is a surname and a year, never a credential"
regexTarget = "line"
regexes = ['''^\s*"citekey": "[a-z-]+\d{4}[a-z]?",?$''']

[[allowlists]]
description = "A line that maps a file path to a SHA-256 digest is an audit baseline entry, never a credential"
regexTarget = "line"
regexes = ['''^\s*"[\w./ -]+\.\w+": "[0-9a-f]{64}",?$''']
