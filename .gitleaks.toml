title = "research-assistant"

[extend]
useDefault = true

[[allowlists]]
description = "A citation key is a surname and a year, never a credential"
regexTarget = "line"
regexes = ['''^\s*"citekey": "[a-z-]+\d{4}[a-z]?",?$''']

[[allowlists]]
description = "The audit baseline holds one SHA-256 digest per control-plane file"
condition = "AND"
paths = ['''^\.claude/skills/vault-audit/baseline\.json$''']
regexes = ['''^[0-9a-f]{64}$''']

[[allowlists]]
description = "A setting whose value begins with placeholder stands in for a test value, never a credential"
regexTarget = "line"
regexes = ['''^\s*[\w.]+: "placeholder[/:-][a-z0-9/:-]*",?$''']
